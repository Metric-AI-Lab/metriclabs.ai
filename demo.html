<title>Harness Console v0.5</title>
<meta name="description" content="Interactive v0.1 demo of a video-first harness for physical-world AI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Dark-first tokens. Light comes from the OS/host, or from the in-page theme switch (data-ui on <html>). */
:root{
  --bg:#0A0D12; --panel:#10141B; --raised:#171C25; --raised-2:#1E2430; --hover:#252C39;
  --line:#232A35; --line-2:#313947;
  --text:#E3E7ED; --muted:#8D97A7; --faint:#5A6475;
  --accent:#FFB547; --accent-ink:#1B1204; --accent-soft:rgba(255,181,71,.13); --accent-text:#FFB547;
  --live:#FF4D5A; --live-soft:rgba(255,77,90,.14); --ok:#3FD49B; --info:#7CB7FF;
  --alert-bg:#2A1216; --shadow:0 18px 44px rgba(0,0,0,.55); --key-edge:#0B0E13;
  --r-sm:6px; --r:9px; --r-lg:13px;
  --ui:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-ui="dark"]){
    --bg:#E7EAEE; --panel:#F7F8FA; --raised:#FFFFFF; --raised-2:#EDF0F4; --hover:#E1E5EB;
    --line:#D7DCE3; --line-2:#C4CBD5;
    --text:#141920; --muted:#525C6A; --faint:#858F9D;
    --accent:#F5A623; --accent-ink:#1B1204; --accent-soft:rgba(245,166,35,.17); --accent-text:#9A5A00;
    --live:#DC2F3E; --live-soft:rgba(220,47,62,.1); --ok:#12915C; --info:#2462C6;
    --alert-bg:#FDECEE; --shadow:0 18px 44px rgba(22,32,52,.18); --key-edge:#B3BCC8;
    color-scheme:light;
  }
}
:root[data-theme="light"]:not([data-ui="dark"]), :root[data-ui="light"]{
  --bg:#E7EAEE; --panel:#F7F8FA; --raised:#FFFFFF; --raised-2:#EDF0F4; --hover:#E1E5EB;
  --line:#D7DCE3; --line-2:#C4CBD5;
  --text:#141920; --muted:#525C6A; --faint:#858F9D;
  --accent:#F5A623; --accent-ink:#1B1204; --accent-soft:rgba(245,166,35,.17); --accent-text:#9A5A00;
  --live:#DC2F3E; --live-soft:rgba(220,47,62,.1); --ok:#12915C; --info:#2462C6;
  --alert-bg:#FDECEE; --shadow:0 18px 44px rgba(22,32,52,.18); --key-edge:#B3BCC8;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); color:var(--text); font:13px/1.45 var(--ui); padding-inline:16px; padding-block:12px; overflow:hidden; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
input,select,textarea{font:inherit; color:var(--text)}
kbd{font:500 10px/1 var(--mono); color:var(--muted); border:1px solid var(--line-2); border-bottom-width:2px; border-radius:4px; padding:2px 4px; background:var(--raised)}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.spacer{flex:1}
svg.lucide{width:16px; height:16px; stroke-width:1.75; flex:none}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none}
.dot.ok{background:var(--ok); box-shadow:0 0 0 3px rgba(63,212,155,.15)}
.dot.live{background:var(--live); animation:pulse 1.6s infinite}
.dot.rec{background:var(--live)}
@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- shell ---------- */
.app{height:100%; display:grid; grid-template-rows:auto minmax(0,1fr); gap:10px}
.topbar{display:flex; align-items:center; gap:10px; min-width:0; position:relative}
.brand{display:flex; align-items:baseline; gap:6px; padding-right:6px}
.brand b{font-weight:600; font-size:15px; letter-spacing:-.01em}
.brand .ver{font:500 10px var(--mono); color:var(--accent-text); border:1px solid rgba(255,181,71,.35); border-radius:4px; padding:1px 4px}
.mark{width:14px; height:14px; border-radius:3px; align-self:center; background:conic-gradient(from 45deg, var(--accent) 0 25%, transparent 0 50%, var(--accent) 0 75%, transparent 0); border:1.5px solid var(--accent)}
.device-btn{display:flex; align-items:center; gap:8px; height:34px; padding:0 10px; border:1px solid var(--line-2); border-radius:var(--r); background:var(--raised); min-width:0}
.device-btn:hover{background:var(--hover)}
.device-btn .name{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.device-btn .meta{color:var(--muted); font-size:12px; white-space:nowrap}
.device-menu{position:absolute; top:40px; left:92px; width:340px; max-width:calc(100vw - 32px); background:var(--raised); border:1px solid var(--line-2); border-radius:var(--r-lg); padding:6px; z-index:40; box-shadow:var(--shadow)}
.dm-label{font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:8px 10px 4px}
.dm-item{display:flex; gap:10px; align-items:center; width:100%; padding:9px 10px; border-radius:var(--r-sm); text-align:left}
.dm-item:hover{background:var(--hover)}
.dm-item.on{background:var(--accent-soft)}
.dm-item .t{font-weight:500}
.dm-item .s{color:var(--muted); font-size:12px}
.dm-item .ico{width:30px; height:30px; border-radius:7px; background:var(--raised-2); display:grid; place-items:center; flex:none}
.device-btn .dot{margin-right:1px}
.stat{display:flex; align-items:center; gap:6px; height:26px; padding:0 9px; border-radius:20px; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-size:12px; white-space:nowrap}
.icon-btn{position:relative; width:34px; height:34px; display:grid; place-items:center; border-radius:var(--r); border:1px solid var(--line-2); background:var(--raised); flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn.sm{width:28px; height:28px; border-color:transparent; background:transparent}
.icon-btn.sm:hover{background:var(--hover)}
.icon-btn.on{background:var(--live-soft); border-color:rgba(255,77,90,.5); color:var(--live)}
.badge{position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--live); color:#fff; font:600 10px/17px var(--mono); text-align:center}
.main{display:grid; grid-template-columns:minmax(0,1fr) 372px; gap:10px; min-height:0; transition:grid-template-columns .22s ease}
.main.chat-collapsed{grid-template-columns:minmax(0,1fr) 52px}
.app.focus .topbar{display:none}
.stage:fullscreen{border:0; border-radius:0; background:#000}
.stage:fullscreen .grid{padding:2px; gap:2px}
#padBtn.on,#focusBtn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.lib[hidden],.stage[hidden]{display:none!important}
.theme-seg{display:flex; padding:2px; gap:2px; background:var(--panel); border:1px solid var(--line); border-radius:9px; flex:none}
.theme-seg button{width:28px; height:26px; display:grid; place-items:center; border-radius:7px; color:var(--muted)}
.theme-seg button:hover{color:var(--text)}
.theme-seg button.on{background:var(--raised-2); color:var(--text); box-shadow:inset 0 0 0 1px var(--line-2)}

/* ---------- stage ---------- */
.stage{position:relative; display:flex; flex-direction:column; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.seg{display:flex; padding:2px; gap:2px; background:var(--bg); border:1px solid var(--line); border-radius:8px; flex:none}
.seg button{width:28px; height:24px; display:grid; place-items:center; border-radius:6px; color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--raised-2); color:var(--text)}
.seg button:disabled{opacity:.3; cursor:not-allowed}
.viewport{position:relative; flex:1; min-height:0; display:flex; flex-direction:column}
.grid{flex:1; display:grid; gap:6px; padding:6px; min-height:0}
.grid[data-layout="1"]{grid-template:minmax(0,1fr)/minmax(0,1fr)}
.grid[data-layout="2"]{grid-template:minmax(0,1fr)/repeat(2,minmax(0,1fr))}
.grid[data-layout="4"]{grid-template:repeat(2,minmax(0,1fr))/repeat(2,minmax(0,1fr))}
.grid[data-layout="1+3"]{grid-template:repeat(3,minmax(0,1fr))/minmax(0,3fr) minmax(0,1fr)}
.grid[data-layout="1+3"] .tile.lead{grid-row:1 / span 3}
.tile{position:relative; background:#000; border-radius:8px; overflow:hidden; min-height:0; min-width:0; cursor:crosshair; box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.tile[hidden]{display:none!important}
.tile.sel::after{content:""; position:absolute; inset:0; border-radius:8px; box-shadow:inset 0 0 0 2px var(--accent); pointer-events:none}
.tile.alarm::after{content:""; position:absolute; inset:0; border-radius:8px; box-shadow:inset 0 0 0 3px var(--live); animation:pulse .5s 4; pointer-events:none}
.tile canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.tile .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.tile .flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.hud{position:absolute; display:flex; gap:5px; align-items:center; pointer-events:none; max-width:calc(100% - 16px)}
.hud.tl{top:8px; left:8px}
.hud.tr{top:8px; right:8px}
.hud.bl{bottom:8px; left:8px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:5px; font:500 11px/1 var(--mono); padding:5px 7px; border-radius:5px; background:rgba(6,8,12,.66); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.08); color:#DDE3EA; white-space:nowrap}
.chip b{font-weight:500; color:var(--accent)}
.chip.live{color:#fff}
.chip.rec{color:var(--live)}
.chip.dvr{color:var(--info)}
.tile .busy{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none}
.hint{position:absolute; left:50%; bottom:108px; transform:translateX(-50%); font-size:12px; color:#DDE3EA; background:rgba(6,8,12,.7); border:1px solid rgba(255,255,255,.1); padding:6px 11px; border-radius:20px; pointer-events:none; transition:opacity .6s; max-width:calc(100% - 32px); width:max-content; text-align:center; z-index:5}
.hint.gone{opacity:0}

/* transport */
.transport{position:absolute; left:12px; right:12px; bottom:12px; z-index:6; background:rgba(12,15,21,.84); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:8px 10px 6px; transition:opacity .25s, transform .25s}
.transport.hide{opacity:0; transform:translateY(8px); pointer-events:none}
.tl{position:relative; height:18px; cursor:pointer; touch-action:none}
.tl-track{position:absolute; left:0; right:0; top:7px; height:4px; border-radius:2px; background:rgba(255,255,255,.2)}
.tl-fill{position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:#E3E7ED}
.tl-head{position:absolute; top:-4px; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:#fff; box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.tl-mark{position:absolute; top:-5px; width:3px; height:14px; margin-left:-1.5px; border-radius:2px; background:var(--live); cursor:pointer}
.tl-mark.clip{background:var(--info)}
.tl-mark.ok{background:var(--ok)}
.tl-mark.predict{background:var(--accent)}
.tl-mark:hover{transform:scaleX(1.8)}
.tl-tip{position:absolute; bottom:22px; transform:translateX(-50%); font:500 11px var(--mono); background:#1E2430; color:#E3E7ED; border:1px solid #313947; padding:4px 7px; border-radius:5px; white-space:nowrap; pointer-events:none}
.tp-row{display:flex; align-items:center; gap:2px; margin-top:4px}
.tp{height:30px; min-width:30px; display:grid; place-items:center; border-radius:7px; color:#D4DAE3; padding:0 6px}
.tp:hover{background:rgba(255,255,255,.08)}
.tp.play{width:36px; background:rgba(255,255,255,.08)}
.tp.txt{font:500 12px var(--mono)}
.tp.on{color:var(--live)}
.tp.pin-on{color:var(--accent)}
.tc{font-size:12px; color:#D4DAE3; margin:0 8px; white-space:nowrap}
.tc span{color:#7B8595}
.live-pill{display:flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:6px; font:600 11px var(--mono); letter-spacing:.05em; background:var(--live); color:#fff}
.live-pill .dot{background:#fff}
.live-pill.behind{background:transparent; color:#A3ACBA; border:1px solid rgba(255,255,255,.18)}
.live-pill.behind .dot{background:#7B8595; animation:none}
.live-pill[hidden]{display:none}

/* task bar: what the robot was told to do, how far it is, and what the verifier thinks */
.taskbar{display:flex; align-items:center; gap:10px; padding:6px 8px 6px 10px; border-bottom:1px solid var(--line); background:var(--panel); min-width:0; flex-wrap:wrap}
.taskbar .chev{color:var(--muted); transition:transform .2s}
.taskbar .chev.open{transform:rotate(180deg)}
.taskbar.ok{background:linear-gradient(90deg, rgba(63,212,155,.13), transparent 55%)}
.taskbar.bad{background:linear-gradient(90deg, rgba(255,77,90,.15), transparent 55%)}
.taskbar.risk{background:linear-gradient(90deg, rgba(255,181,71,.15), transparent 55%)}
.tk-ico{width:26px; height:26px; border-radius:7px; display:grid; place-items:center; background:var(--raised-2); color:var(--muted); flex:none}
.taskbar.ok .tk-ico{color:var(--ok)} .taskbar.bad .tk-ico{color:var(--live)} .taskbar.risk .tk-ico{color:var(--accent-text)}
.tk-name{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30ch; min-width:0}
.tk-name em{font-style:normal; color:var(--muted); font-weight:400}
.tk-none{color:var(--muted); font-size:12px}
.tk-prog{flex:1; min-width:190px; display:grid; gap:4px}
.tk-bar{height:5px; border-radius:3px; background:var(--line-2); overflow:hidden}
.tk-bar i{display:block; height:100%; width:0; background:var(--accent); transition:width .3s}
.taskbar.ok .tk-bar i{background:var(--ok)} .taskbar.bad .tk-bar i{background:var(--live)}
.tk-step{font:11px var(--mono); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.verif{display:flex; align-items:center; gap:8px; padding:4px 9px; border-radius:9px; border:1px solid var(--line-2); background:var(--raised); white-space:nowrap; flex:none}
.verif .lab{font:500 9px var(--mono); letter-spacing:.07em; color:var(--faint); display:block}
.verif .val{font:600 12px var(--mono); font-variant-numeric:tabular-nums}
.verif.good .val{color:var(--ok)} .verif.risk .val{color:var(--accent-text)} .verif.bad .val{color:var(--live)}
.verif canvas{display:block; width:56px; height:20px}
.tk-btns{display:flex; gap:6px; flex:none}
.tk-btns .btn{height:28px; padding:0 10px; font-size:12px}
.policy{font:500 10px var(--mono); padding:3px 7px; border-radius:5px; border:1px solid var(--line-2); color:var(--muted); white-space:nowrap}

/* left-click action bar, drawn over the video */
.qbar{position:absolute; z-index:7; display:flex; gap:3px; padding:4px; border-radius:11px; background:rgba(10,13,19,.84); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.14); box-shadow:0 12px 28px rgba(0,0,0,.45); white-space:nowrap}
.qbar b{display:flex; align-items:center; padding:0 8px 0 6px; font:500 11px var(--mono); color:#FFD79A}
.qbar button{display:flex; align-items:center; gap:5px; height:26px; padding:0 9px; border-radius:7px; color:#DDE3EA; font-size:12px}
.qbar button:hover{background:rgba(255,255,255,.15); color:#fff}
.qbar button svg{width:13px; height:13px}
.qbar .x{padding:0 6px; color:rgba(255,255,255,.5)}

/* stop banner */
.stopbar{position:absolute; top:44px; left:50%; transform:translateX(-50%); z-index:9; display:flex; align-items:center; gap:10px; padding:8px 10px 8px 12px; border-radius:12px; background:rgba(200,35,47,.94); color:#fff; box-shadow:0 14px 34px rgba(0,0,0,.45); font-size:13px}
.stopbar b{font:600 12px var(--mono); letter-spacing:.09em}
.stopbar .btn{height:26px; background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.4); color:#fff}
.stopbar .btn:hover{background:rgba(255,255,255,.3)}
.viewport.stopped::after{content:""; position:absolute; inset:0; border-radius:8px; box-shadow:inset 0 0 0 3px var(--live); pointer-events:none; z-index:8}

/* quick ask, glass */
.qa-bg{position:fixed; inset:0; z-index:95; background:rgba(8,11,16,.45); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:flex; justify-content:center; padding:13vh 16px 16px; animation:fade .16s ease-out}
.qa{width:min(660px,100%); max-height:72vh; display:flex; flex-direction:column; border-radius:22px; overflow:hidden; color:#F4F7FA;
  background:linear-gradient(180deg, rgba(74,86,108,.5), rgba(16,20,28,.62));
  backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 40px 90px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.07), inset 0 0 40px rgba(255,255,255,.05);
  animation:qain .2s cubic-bezier(.2,.9,.3,1)}
@keyframes qain{from{opacity:0; transform:translateY(-12px) scale(.985)}}
@keyframes fade{from{opacity:0}}
.qa-top{display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid rgba(255,255,255,.13)}
.qa-top svg{width:19px; height:19px; color:#FFD79A}
.qa-top input{flex:1; min-width:0; background:transparent; border:0; outline:none; font-size:17px; color:#fff}
.qa-top input::placeholder{color:rgba(255,255,255,.45)}
.qa-top kbd{color:rgba(255,255,255,.6); border-color:rgba(255,255,255,.25); background:rgba(255,255,255,.08)}
.qa-list{overflow-y:auto; padding:6px; min-height:0; scrollbar-width:thin}
.qa-item{display:flex; align-items:center; gap:11px; width:100%; padding:10px 12px; border-radius:13px; text-align:left; color:rgba(255,255,255,.92); font-size:13.5px}
.qa-item .d{margin-left:auto; font:11px var(--mono); color:rgba(255,255,255,.5); white-space:nowrap}
.qa-item.on{background:rgba(255,255,255,.17); box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.qa-item svg{width:16px; height:16px; color:rgba(255,255,255,.78); flex:none}
.qa-item .t{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.qa-foot{display:flex; align-items:center; gap:10px; padding:9px 14px; border-top:1px solid rgba(255,255,255,.13); font:11px var(--mono); color:rgba(255,255,255,.62)}
.qa-foot kbd{color:rgba(255,255,255,.7); border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.08)}
.qa-btn{display:flex; align-items:center; gap:7px; height:34px; padding:0 11px; border-radius:var(--r); border:1px solid var(--line-2); background:var(--raised); color:var(--muted); font-size:12px; white-space:nowrap; flex:none}
.qa-btn:hover{background:var(--hover); color:var(--text)}
.qa-btn svg{color:var(--accent-text)}

/* live / library switch */
.mode-seg button{width:auto; height:28px; padding:0 11px; gap:6px; display:flex; align-items:center; font-size:12.5px; font-weight:500}
.mode-seg button svg{width:14px; height:14px}
.replay-chip{display:flex; align-items:center; gap:7px; height:30px; padding:0 3px 0 10px; border-radius:8px; background:var(--live-soft); color:var(--live); font:500 12px var(--mono); max-width:320px; min-width:0; flex:none}
.replay-chip span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.replay-chip button{width:24px; height:24px; display:grid; place-items:center; border-radius:6px; color:inherit}
.replay-chip button:hover{background:rgba(255,77,90,.18)}
.replay-chip svg{width:14px; height:14px}
.app.lib #layoutSeg,.app.lib #overlayBtn,.app.lib #padBtn,.app.lib #focusBtn{display:none}

/* library */
.lib{position:relative; display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.lib-head{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.lib-tabs{display:flex; gap:2px; padding:2px; background:var(--bg); border:1px solid var(--line); border-radius:9px}
.lib-tabs button{padding:5px 12px; border-radius:7px; color:var(--muted); font-weight:500; font-size:12.5px; white-space:nowrap}
.lib-tabs button.on{background:var(--raised-2); color:var(--text); box-shadow:inset 0 0 0 1px var(--line-2)}
.lib-tabs .n{font:500 11px var(--mono); color:var(--faint); margin-left:6px}
.lib-head .hist-search{flex:1; min-width:170px; max-width:340px}
.lib-head .steps{margin-left:auto}
.lib-head select{height:30px; border-radius:7px; border:1px solid var(--line-2); background:var(--bg); padding:0 8px; font-size:12px}
.lib-chips{display:flex; gap:6px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.lchip{display:flex; align-items:center; gap:6px; font-size:12px; padding:4px 10px; border-radius:14px; border:1px solid var(--line-2); color:var(--muted); white-space:nowrap}
.lchip:hover{color:var(--text)}
.lchip .n{font:500 11px var(--mono); color:var(--faint)}
.lchip.on{background:var(--text); color:var(--bg); border-color:var(--text)}
.lchip.on .n{color:inherit; opacity:.7}
.lchip .sw{width:8px; height:8px; border-radius:2px}
.lib-stat{margin-left:auto; font-size:12px; color:var(--muted)}
.lib-stat b{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums}
.lib-scroll{flex:1; overflow:auto; min-height:0; scrollbar-width:thin}
table.lt{width:100%; border-collapse:separate; border-spacing:0; font-size:13px; min-width:720px}
.lt th{position:sticky; top:0; z-index:3; background:var(--panel); text-align:left; font:500 10px var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--faint); padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
.lt th.num{text-align:right}
.lt td{padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle}
.lt tr.row{cursor:pointer}
.lt tr.row:hover td{background:var(--raised)}
.lt tr.row:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.lt tr.row.sel td{background:var(--accent-soft)}
.lt tr.grp td{position:sticky; top:31px; z-index:2; background:var(--bg); font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:5px 10px}
.lt td.pick{width:30px; padding-right:0}
.lt td.pick input{display:block; accent-color:var(--accent); width:15px; height:15px; margin:0; cursor:pointer}
.lt td.th{width:78px; padding-right:2px}
.lt td.th img{width:70px; height:40px; object-fit:cover; border-radius:6px; display:block; background:#000}
.lt .t{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30ch}
.lt .s{font:11px var(--mono); color:var(--faint); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:28ch}
.lt .num{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.lt .when{font:12px var(--mono); color:var(--muted); white-space:nowrap}
.lt .dim{color:var(--faint)}
.opill{display:inline-flex; align-items:center; gap:5px; font:500 11px var(--mono); padding:3px 8px; border-radius:6px; white-space:nowrap}
.opill svg{width:12px; height:12px}
.opill.success{color:var(--ok); background:rgba(63,212,155,.12)}
.opill.failed{color:var(--live); background:var(--live-soft)}
.opill.caught{color:var(--accent-text); background:var(--accent-soft)}
.opill.stopped{color:var(--muted); background:var(--raised-2)}
.opill.demo{color:var(--info); background:rgba(124,183,255,.13)}
.opill.live{color:#fff; background:var(--live)}
.spk{display:flex; align-items:center; gap:8px; white-space:nowrap}
.spk svg{width:80px; height:24px; display:block; flex:none}
.spk .success{color:var(--ok)} .spk .failed{color:var(--live)} .spk .caught{color:var(--accent)} .spk .stopped,.spk .demo,.spk .act{color:var(--muted)}
.spk .v{font:500 11px var(--mono); color:var(--muted)}
.acnt{display:inline-grid; place-items:center; min-width:22px; height:20px; padding:0 6px; border-radius:10px; font:600 11px var(--mono); background:var(--live-soft); color:var(--live)}
.bulk{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:6; display:flex; align-items:center; gap:8px; padding:6px 6px 6px 14px; border-radius:12px; background:var(--text); color:var(--bg); box-shadow:var(--shadow); white-space:nowrap; max-width:calc(100% - 24px)}
.bulk b{font-weight:600}
.bulk .btn{background:transparent; color:inherit; border-color:rgba(140,150,165,.55)}
.bulk .btn:hover{background:rgba(140,150,165,.2)}
.bulk .btn.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.lib-empty{padding:40px 16px; text-align:center; color:var(--faint)}

/* control dock (bottom, collapsible) */
.dock{flex:none; border-top:1px solid var(--line); background:var(--panel); user-select:none}
.dock-line{display:flex; align-items:center; gap:10px; min-height:34px; padding:4px 8px 0 14px}
.dock-line .ttl{display:flex; align-items:center; gap:7px; font:500 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--faint); white-space:nowrap}
.dock-line .ttl svg{width:13px; height:13px}
.stopbtn{display:flex; align-items:center; gap:7px; height:32px; padding:0 13px; border-radius:9px; background:#C8232F; color:#fff; font:600 12px var(--mono); letter-spacing:.06em; box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
.stopbtn:hover{background:#DD2C39}
.stopbtn.engaged{background:transparent; color:var(--live); border:1.5px dashed var(--live); box-shadow:none}
.takebtn{display:flex; align-items:center; gap:7px; height:32px; padding:0 12px; border-radius:9px; border:1px solid var(--line-2); background:var(--raised); font-size:12px; font-weight:500; white-space:nowrap}
.takebtn:hover{background:var(--hover)}
.takebtn.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.takebtn.on svg{color:var(--accent-ink)}
.dsec-t svg{width:13px; height:13px}
.dsec.safety .dsec-t svg{color:var(--live)}
.dsec.recovery .dsec-t svg{color:var(--info)}
.linkbtn{font:500 10px var(--mono); color:var(--accent-text); text-align:left; text-decoration:underline; text-underline-offset:2px}
.dock-sum{font:500 11px var(--mono); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; font-variant-numeric:tabular-nums}
.keys-chip{display:inline-flex; align-items:center; gap:5px; font:500 10px var(--mono); letter-spacing:.04em; padding:3px 7px; border-radius:5px; border:1px solid var(--line-2); color:var(--muted); white-space:nowrap}
.keys-chip.on{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
.dock.collapsed{display:none}
.dock-body{display:flex; flex-wrap:wrap; gap:12px 18px; padding:4px 14px 14px; align-items:flex-start}
.dock.collapsed .dock-body{display:none}
.dsec{display:grid; gap:7px; align-content:start}
.dsec-t{font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--faint); display:flex; gap:8px; align-items:center}
.keys{display:grid; grid-template-columns:repeat(3,56px); gap:5px}
.key{position:relative; height:58px; border-radius:10px; background:var(--raised); border:1px solid var(--line-2); border-bottom:3px solid var(--key-edge); display:grid; align-content:center; justify-items:center; gap:3px; color:var(--text); transition:transform .06s}
.key:hover{background:var(--hover)}
.key .k{font:600 15px/1 var(--mono); display:flex; align-items:center; gap:3px}
.key .k svg{width:14px; height:14px}
.key .u{font:500 8.5px/1.1 var(--mono); color:var(--muted); letter-spacing:.01em; text-align:center; padding:0 3px}
.key .u i{font-style:normal; color:var(--accent-text)}
.key.hit,.key:active{background:var(--accent); border-color:var(--accent); border-bottom-color:#B97A12; color:var(--accent-ink); transform:translateY(2px)}
.key.hit .u,.key:active .u,.key.hit .u i,.key:active .u i{color:var(--accent-ink)}
.key.blank{visibility:hidden}
.key.wide{width:100%}
.key.danger{background:#C8232F; border-color:#C8232F; border-bottom-color:#7E141C; color:#fff}
.key.danger .u{color:rgba(255,255,255,.85)}
.key.danger.engaged{background:transparent; color:var(--live); border:1.5px dashed var(--live)}
.key.danger.engaged .u{color:var(--live)}
.gcol{display:grid; gap:5px; grid-template-columns:repeat(2,56px)}
.gmeter{height:6px; border-radius:3px; background:var(--line-2); overflow:hidden}
.gmeter i{display:block; height:100%; background:var(--ok); transition:width .1s}
.steps{display:flex; gap:2px; padding:2px; background:var(--bg); border:1px solid var(--line); border-radius:7px; width:max-content}
.steps button{font:500 11px var(--mono); padding:3px 7px; border-radius:5px; color:var(--muted)}
.steps button.on{background:var(--raised-2); color:var(--text)}
.readout{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; font:500 11px var(--mono); font-variant-numeric:tabular-nums}
.readout div{background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; white-space:nowrap}
.readout span{display:block; font-size:9px; color:var(--faint); letter-spacing:.06em}
.dlog{flex:1; min-width:180px}
.alog{max-height:124px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; background:var(--bg); scrollbar-width:thin}
.alog-row{display:grid; grid-template-columns:38px 1fr 54px 64px; gap:6px; padding:3px 8px; font:500 11px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
.alog-row:first-child{color:var(--text)}
.alog-row b{font-weight:500; color:var(--text)}
.alog-empty{padding:8px; font-size:12px; color:var(--faint)}
.ep{display:flex; align-items:center; gap:8px; font:500 11px var(--mono); color:var(--muted); flex-wrap:wrap}
.ep .recdot{width:8px; height:8px; border-radius:50%; background:var(--faint)}
.ep .recdot.on{background:var(--live); animation:pulse 1.4s infinite}
.vchips{display:grid; gap:4px}
.vchip{display:flex; align-items:center; gap:8px; padding:6px 9px; border-radius:8px; border:1px solid var(--line); text-align:left; font-size:12px; white-space:nowrap}
.vchip:hover{background:var(--hover)}
.vchip.on{border-color:var(--accent); background:var(--accent-soft)}
.vchip .mono{font-size:11px; color:var(--accent-text)}
.zoom-row{display:flex; align-items:center; gap:8px; width:140px}
.zoom-row input{flex:1; accent-color:var(--accent); min-width:0}
.pad-note{font-size:12px; color:var(--muted); max-width:230px}

/* context menu */
.ctx{position:fixed; z-index:60; width:248px; background:var(--raised); border:1px solid var(--line-2); border-radius:11px; padding:5px; box-shadow:var(--shadow); font-size:13px}
.ctx-head{padding:6px 9px 7px; border-bottom:1px solid var(--line); margin-bottom:4px}
.ctx-head .t{font-weight:500; display:flex; gap:6px; align-items:center}
.ctx-head .s{font:11px var(--mono); color:var(--muted)}
.ctx-sec{font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:7px 9px 3px}
.ctx-item{display:flex; align-items:center; gap:9px; width:100%; padding:6px 9px; border-radius:6px; text-align:left}
.ctx-item:hover,.ctx-item:focus-visible{background:var(--hover); outline:none}
.ctx-item .sp{flex:1}
.ctx-item .d{font-size:11px; color:var(--faint)}
.ctx-item.arm svg{color:var(--accent-text)}
.ctx-item.warn svg{color:var(--live)}
.ctx-foot{font-size:11px; color:var(--faint); padding:6px 9px 4px; border-top:1px solid var(--line); margin-top:4px}

/* ---------- chat ---------- */
.chat{display:flex; flex-direction:column; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; position:relative}
.chat-head{display:flex; align-items:center; gap:6px; padding:7px 8px; border-bottom:1px solid var(--line); flex:none}
.chat-body{position:relative; flex:1; min-height:0; display:flex; flex-direction:column}
.chat-rail{display:none; flex-direction:column; align-items:center; gap:6px; padding:8px 0}
.chat-rail .icon-btn{border-color:transparent; background:transparent}
.chat-rail .icon-btn:hover{background:var(--hover)}
.rail-label{writing-mode:vertical-rl; transform:rotate(180deg); font:500 10px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-top:8px}
.unread{position:absolute; top:5px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px var(--panel)}
.main.chat-collapsed .chat-head,.main.chat-collapsed .chat-body{display:none}
.main.chat-collapsed .chat-rail{display:flex}
.hist{position:absolute; inset:0; z-index:4; background:var(--panel); display:flex; flex-direction:column}
.hist-top{display:grid; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line)}
.hist-row{display:flex; align-items:center; gap:8px}
.hist-row h3{margin:0; font-size:13px; font-weight:600}
.hist-search{display:flex; align-items:center; gap:6px; height:32px; padding:0 9px; border-radius:8px; border:1px solid var(--line-2); background:var(--bg)}
.hist-search input{flex:1; border:0; background:transparent; outline:none; min-width:0}
.hist-search svg{color:var(--faint)}
.fchips{display:flex; gap:4px}
.fchip{font-size:12px; padding:4px 9px; border-radius:14px; border:1px solid var(--line-2); color:var(--muted)}
.fchip.on{background:var(--raised-2); color:var(--text)}
.hist-list{flex:1; overflow-y:auto; padding:6px 6px 12px; scrollbar-width:thin}
.hgroup{font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:10px 8px 4px}
.hitem{display:grid; gap:3px; width:100%; padding:9px 10px; border-radius:9px; text-align:left}
.hitem:hover{background:var(--hover)}
.hitem.cur{background:var(--accent-soft)}
.hitem .t{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hitem .p{font-size:12px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.hitem .m{display:flex; gap:6px; align-items:center; font:11px var(--mono); color:var(--faint); flex-wrap:wrap}
.hitem .m svg{width:12px; height:12px}
.hitem .open{color:var(--accent-text)}
.hist-empty{padding:24px 12px; color:var(--faint); text-align:center}
.cmds{position:absolute; left:8px; right:8px; bottom:calc(100% + 6px); z-index:6; background:var(--raised); border:1px solid var(--line-2); border-radius:11px; box-shadow:var(--shadow); padding:4px; max-height:280px; overflow-y:auto}
.cmd{display:flex; gap:10px; align-items:baseline; width:100%; padding:7px 9px; border-radius:7px; text-align:left}
.cmd.on,.cmd:hover{background:var(--hover)}
.cmd .n{font:500 12px var(--mono); color:var(--accent-text); white-space:nowrap}
.cmd .a{font:11px var(--mono); color:var(--faint); white-space:nowrap}
.cmd .d{color:var(--muted); font-size:12px; margin-left:auto; text-align:right}
.cmd-foot{font-size:11px; color:var(--faint); padding:5px 9px 3px; border-top:1px solid var(--line); margin-top:3px}
.helpgrid{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:12px; text-align:left; color:var(--muted); background:var(--raised); border:1px solid var(--line); border-radius:9px; padding:8px 10px}
.helpgrid b{font:500 12px var(--mono); color:var(--accent-text)}
.img-gone{display:block; font:11px var(--mono); color:var(--faint); border:1px dashed var(--line-2); border-radius:7px; padding:14px 10px; text-align:center}
.model-pill{display:flex; align-items:center; gap:6px; height:28px; padding:0 9px; border-radius:7px; background:var(--raised); border:1px solid var(--line-2); font-weight:500; font-size:12px; white-space:nowrap}
.model-pill:hover{background:var(--hover)}
.model-pill svg:first-child{color:var(--accent-text)}
.ctx-chip{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chat-log{flex:1; overflow-y:auto; padding:14px 14px 8px; display:flex; flex-direction:column; gap:14px; scrollbar-width:thin; scrollbar-color:var(--line-2) transparent}
.msg{max-width:100%; overflow-wrap:anywhere}
.msg.user{align-self:flex-end; max-width:88%; background:var(--raised-2); border:1px solid var(--line-2); padding:8px 11px; border-radius:12px 12px 4px 12px}
.msg.user .via{display:flex; gap:5px; align-items:center; font:11px var(--mono); color:var(--faint); margin-bottom:3px}
.msg.ai{display:grid; gap:7px; color:var(--text)}
.msg.ai p{margin:0}
.msg.ai .who{display:flex; gap:6px; align-items:center; font:500 11px var(--mono); color:var(--faint)}
.msg.ai .who svg{width:13px; height:13px; color:var(--accent-text)}
.msg.sys{align-self:center; font:11px var(--mono); color:var(--faint); text-align:center}
.tool{display:flex; align-items:center; gap:8px; padding:6px 9px; border-radius:7px; background:var(--bg); border:1px solid var(--line); font:11.5px var(--mono); color:var(--muted); min-width:0}
.tool .fn{color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1}
.tool .fn i{font-style:normal; color:var(--faint)}
.tool .res{white-space:nowrap; color:var(--ok)}
.tool .spin{width:12px; height:12px; border:1.5px solid var(--line-2); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:none}
.tool svg{width:13px; height:13px}
.units{display:flex; flex-wrap:wrap; gap:3px}
.shot{display:grid; gap:4px; max-width:240px}
.shot img{width:100%; border-radius:7px; border:1px solid var(--line-2); display:block}
.shot span{font:11px var(--mono); color:var(--faint)}
.msg.user .shot{max-width:200px}
.jump{color:var(--info); text-decoration:underline; text-underline-offset:2px; cursor:pointer}
.suggest{display:flex; gap:6px; padding:0 12px 8px; overflow-x:auto; scrollbar-width:none}
.sg{white-space:nowrap; font-size:12px; padding:5px 10px; border-radius:16px; border:1px solid var(--line-2); color:var(--muted)}
.sg:hover{color:var(--text); background:var(--raised)}
.composer{border-top:1px solid var(--line); padding:8px 10px 10px; display:grid; gap:6px; position:relative; flex:none}
.attach{display:inline-flex; align-items:center; gap:6px; font:11px var(--mono); padding:4px 8px; border-radius:6px; border:1px dashed var(--line-2); color:var(--faint)}
.attach.on{border-style:solid; color:var(--text); background:var(--raised)}
.attach svg{width:13px; height:13px}
.composer textarea{width:100%; resize:none; border:0; background:transparent; padding:4px 2px; max-height:120px; line-height:1.45; outline:none}
.composer textarea::placeholder{color:var(--faint)}
.comp-row{display:flex; align-items:center; gap:6px}
.kbd-hint{font-size:11px; color:var(--faint)}
.send-btn{width:32px; height:32px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center}
.send-btn:disabled{background:var(--raised-2); color:var(--faint); cursor:default}
.voice{position:absolute; inset:0; background:var(--panel); display:flex; flex-direction:column; gap:10px; padding:12px 12px 10px}
.voice-top{display:flex; align-items:center; gap:10px}
.wave{display:flex; align-items:center; gap:3px; height:34px; flex:1}
.wave i{display:block; width:3px; border-radius:2px; background:var(--accent); height:4px; transition:height .08s}
.vt{font-size:14px; min-height:40px; color:var(--text)}
.vt .partial{color:var(--muted)}
.v-row{display:flex; align-items:center; gap:8px}
.v-row .small{font-size:11px; color:var(--faint)}
.btn{height:30px; padding:0 12px; border-radius:8px; border:1px solid var(--line-2); background:var(--raised); font-size:12px; font-weight:500; white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.rec-orb{width:34px; height:34px; border-radius:50%; background:var(--live); display:grid; place-items:center; color:#fff; box-shadow:0 0 0 6px var(--live-soft); animation:pulse 1.4s infinite}

/* ---------- modal ---------- */
.modal-bg{position:fixed; inset:0; z-index:80; background:rgba(3,5,8,.62); display:grid; place-items:center; padding:16px}
.modal{width:min(820px,100%); max-height:min(640px,calc(100vh - 32px)); display:grid; grid-template-rows:auto minmax(0,1fr); background:var(--panel); border:1px solid var(--line-2); border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
.m-head{display:flex; align-items:center; gap:10px; padding:12px 12px 12px 18px; border-bottom:1px solid var(--line)}
.m-head h2{font-size:15px; font-weight:600; margin:0}
.m-head .sub{color:var(--muted); font-size:12px}
.m-body{display:grid; grid-template-columns:180px minmax(0,1fr); min-height:0}
.m-tabs{border-right:1px solid var(--line); padding:8px; display:grid; align-content:start; gap:2px}
.m-tab{display:flex; gap:9px; align-items:center; padding:8px 10px; border-radius:7px; color:var(--muted); text-align:left}
.m-tab:hover{background:var(--raised); color:var(--text)}
.m-tab.on{background:var(--raised-2); color:var(--text)}
.m-pane{overflow-y:auto; padding:16px 18px 20px; display:grid; gap:18px; align-content:start}
.m-pane h3{margin:0 0 8px; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.02em}
.opt-list{display:grid; gap:6px}
.opt{display:flex; gap:12px; align-items:center; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--raised); text-align:left; width:100%}
.opt:hover{border-color:var(--line-2)}
.opt.on{border-color:var(--accent); background:var(--accent-soft)}
.opt .t{font-weight:500}
.opt .s{font-size:12px; color:var(--muted)}
.opt .r{margin-left:auto; text-align:right; font:11px var(--mono); color:var(--muted); white-space:nowrap}
.tag{font:500 10px var(--mono); padding:2px 6px; border-radius:4px; border:1px solid var(--line-2); color:var(--muted); white-space:nowrap}
.tag.local{color:var(--ok); border-color:rgba(63,212,155,.35)}
.fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px}
.field{display:grid; gap:5px; font-size:12px; color:var(--muted)}
.field select,.field input[type=text],.field input[type=url],.inp{height:32px; border-radius:7px; border:1px solid var(--line-2); background:var(--bg); padding:0 9px; min-width:0; width:100%}
.src{display:grid; grid-template-columns:auto 1fr 130px minmax(0,1.4fr) auto; gap:8px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--raised)}
.src .id{font:500 11px var(--mono); color:var(--accent-text)}
.drop{display:grid; place-items:center; gap:6px; padding:22px; border:1.5px dashed var(--line-2); border-radius:12px; color:var(--muted); text-align:center; cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent); color:var(--text); background:var(--accent-soft)}
.drop svg{width:22px; height:22px}
.switch{position:relative; width:34px; height:20px; border-radius:10px; background:var(--line-2); flex:none; transition:background .15s}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .15s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(14px)}
.rule{display:flex; gap:12px; align-items:center; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--raised)}
.rule .t{font-weight:500}
.rule .s{font-size:12px; color:var(--muted); display:flex; gap:5px; flex-wrap:wrap; margin-top:3px}
.rule.off .t{color:var(--muted)}
.ev{display:flex; gap:10px; align-items:center; padding:8px 4px; border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .when{font:11px var(--mono); color:var(--muted); width:62px; flex:none}
.ev .sev{width:8px; height:8px; border-radius:2px; background:var(--live); flex:none}
.ev .sev.clip{background:var(--info)}
.ev .what{flex:1; min-width:0}
.ev .what small{display:block; color:var(--faint); font:11px var(--mono)}
.new-alert{display:grid; gap:10px; padding:12px; border-radius:12px; border:1px solid var(--line-2); background:var(--raised)}
.new-alert .nl{height:38px; font-size:14px}
.checks{display:flex; flex-wrap:wrap; gap:6px}
.ck{display:flex; align-items:center; gap:6px; font-size:12px; padding:5px 9px; border-radius:7px; border:1px solid var(--line-2); color:var(--muted); cursor:pointer}
.ck input{accent-color:var(--accent); margin:0}
.ck:has(input:checked){color:var(--text); border-color:rgba(255,181,71,.5)}
.vocab{display:flex; flex-wrap:wrap; gap:4px}
.note{font-size:12px; color:var(--faint)}

/* toasts */
.toasts{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:100; display:grid; gap:6px; justify-items:center; pointer-events:none; width:max-content; max-width:calc(100vw - 32px)}
.toast{display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:10px; background:var(--raised-2); border:1px solid var(--line-2); box-shadow:var(--shadow); font-size:13px; animation:tin .25s ease-out; pointer-events:auto}
.toast.alert{border-color:rgba(255,77,90,.55); background:var(--alert-bg)}
.toast.alert svg{color:var(--live)}
.toast .act{color:var(--accent-text); font-weight:500; margin-left:6px; cursor:pointer}
@keyframes tin{from{opacity:0; transform:translateY(-6px)}}

/* ---------- small screens ---------- */
@media (max-width:1020px){
  .main{grid-template-columns:minmax(0,1fr) 320px}
  .status .stat:nth-child(n+3){display:none}
}
@media (max-width:820px){
  body{overflow:auto}
  html,body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .stage{height:auto}
  .viewport{flex:none; height:58vh; min-height:300px}
  .chat{height:72vh; min-height:420px}
  .main.chat-collapsed{grid-template-columns:minmax(0,1fr)}
  .main.chat-collapsed .chat{height:auto; min-height:0}
  .main.chat-collapsed .chat-rail{flex-direction:row; padding:4px 8px}
  .rail-label{writing-mode:horizontal-tb; transform:none; margin:0 0 0 4px}
  .dsec,.dlog{min-width:0}
  .tk-name{max-width:100%}
  .qa-bg{padding-top:8vh}
  .theme-seg{display:none}
  .kbd-hint,.qa-btn span,.qa-btn kbd{display:none}
  .m-body{grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr)}
  .m-tabs{display:flex; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line)}
  .src{grid-template-columns:auto 1fr auto}
  .src .u,.src .ty{grid-column:1 / -1}
  .tc span{display:none}
}
@media (max-width:480px){
  .grid[data-layout="4"]{grid-template:repeat(4,minmax(0,1fr))/minmax(0,1fr)}
  .grid[data-layout="2"]{grid-template:repeat(2,minmax(0,1fr))/minmax(0,1fr)}
  .tp-row .tp.hide-xs{display:none}
  .brand .ver{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important; transition-duration:.01ms!important}
}

<script>
/* ================= core ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ic = n => `<i data-lucide="${n}"></i>`;
function icons(){ try { if (window.lucide) lucide.createIcons(); } catch (e) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pad2 = n => String(Math.floor(n)).padStart(2, '0');
const fmtDur = s => { s = Math.max(0, s); return pad2(s / 60) + ':' + pad2(s % 60); };
const fmtClock = ms => { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); };
function hash(s){ let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rr(c, x, y, w, h, r){ c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); else c.rect(x, y, w, h); }
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

const COL = { person: '#5CE1E6', forklift: '#C792FF', truck: '#C792FF', pallet: '#FF8FB1', box: '#F4D35E', object: '#A6E86A' };
const LABEL = { person: 'person', forklift: 'forklift', truck: 'truck', pallet: 'pallet', box: 'parcel', object: 'object' };
const BASEH = { person: 0.44, forklift: 0.36, truck: 0.34, pallet: 0.16, box: 0.07 };
const BUFFER = 600; // seconds of DVR kept for live sources

const DEVICES = {
  warehouse: { id: 'warehouse', name: 'Warehouse · Bay 3', kind: 'cameras', meta: '4 cameras', icon: 'cctv', live: true, layout: '4',
    views: [
      { id: 'CAM-01', name: 'Dock door', scene: 'dock', ptz: true, res: '1080p · 30 fps' },
      { id: 'CAM-02', name: 'Aisle 4', scene: 'aisle', ptz: true, res: '1080p · 30 fps' },
      { id: 'CAM-03', name: 'Packing', scene: 'packing', ptz: false, res: '720p · 25 fps' },
      { id: 'CAM-04', name: 'Yard', scene: 'yard', ptz: false, res: '1080p · 15 fps · IR' } ] },
  arm: { id: 'arm', name: 'Franka FR3 · Cell 2', kind: 'arm', meta: 'arm · ego + exo', icon: 'bot', live: true, layout: '2',
    views: [
      { id: 'EXO', name: 'Exo · RealSense D435', scene: 'exo', res: '848×480 · 30 fps' },
      { id: 'WRIST', name: 'Ego · wrist D405', scene: 'wrist', res: '640×480 · 30 fps' } ] },
  upload: { id: 'upload', name: 'night_shift_0419.mp4', kind: 'file', meta: 'uploaded · 4:12', icon: 'file-video', live: false, duration: 252, layout: '1',
    views: [ { id: 'FILE', name: 'night_shift_0419.mp4', scene: 'aisleNight', res: '1080p · 30 fps' } ] }
};

const S = {
  dev: null, sel: 0, layout: '4',
  playing: true, speed: 1, t: BUFFER, follow: true, edge: BUFFER, lastNow: performance.now(), wall0: Date.now(),
  model: 'Claude Opus 5',
  padOpen: false, step: 0.02, pinned: false, rec: null, mode: 'auto', speedCap: 'Full', task: null,
  ov: {}, ptz: {},
  arm: null, objs: null, hist: [], histAt: 0, seq: null, estop: false, units: [],
  events: [], rules: [], unread: 0, attach: true, busy: false,
};
const VR = []; // per-tile runtime

/* clock helpers: scene time <-> wall clock */
const wallAt = t => S.wall0 + (t - BUFFER) * 1000;
function timeLabel(t){
  if (S.replay) return S.replay.kind === 'hour' ? fmtClock(S.replay.item.start + t * 1000) : fmtDur(t) + ' <span>/ ' + fmtDur(S.replay.dur) + '</span>';
  if (S.dev.live) return fmtClock(wallAt(t));
  const dur = S.dev.kind === 'video' ? (S.dev.video.duration || 0) : S.dev.duration;
  return fmtDur(t) + ' <span>/ ' + fmtDur(dur) + '</span>';
}

/* ================= camera mapping ================= */
function cover(w, h, a = 16 / 9){ let rw = w, rh = w / a; if (rh < h) { rh = h; rw = h * a; } return { x: (w - rw) / 2, y: (h - rh) / 2, w: rw, h: rh }; }
function fit(w, h, a = 16 / 9){ let rw = w, rh = w / a; if (rh > h) { rh = h; rw = h * a; } return { x: (w - rw) / 2, y: (h - rh) / 2, w: rw, h: rh }; }
function camMap(r, cam){
  const z = cam.zoom, cx = 0.5 + cam.pan, cy = 0.5 + cam.tilt;
  return { K: r.h * z,
    P: (u, v) => [r.x + r.w / 2 + (u - cx) * r.w * z, r.y + r.h / 2 + (v - cy) * r.h * z],
    inv: (x, y) => [(x - r.x - r.w / 2) / (r.w * z) + cx, (y - r.y - r.h / 2) / (r.h * z) + cy] };
}
function poly(c, P, pts, fill, stroke, lw){
  c.beginPath(); pts.forEach((p, i) => { const [x, y] = P(p[0], p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.closePath();
  if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 1; c.stroke(); }
}
function seg(c, P, u0, v0, u1, v1, col, lw){ const [a, b] = P(u0, v0), [d, e] = P(u1, v1); c.strokeStyle = col; c.lineWidth = lw; c.beginPath(); c.moveTo(a, b); c.lineTo(d, e); c.stroke(); }

/* grain texture shared by all feeds */
const grain = document.createElement('canvas'); grain.width = grain.height = 160;
{ const g = grain.getContext('2d'), id = g.createImageData(160, 160); for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); }

/* ================= entity painters (x,y = foot point, H = height px, m = mask colour) ================= */
function drawPerson(c, x, y, H, e, m){
  const w = H * 0.3, sw = Math.sin(e.ph || 0) * H * 0.07, col = a => m || a;
  c.lineCap = 'round';
  c.strokeStyle = col('#262D38'); c.lineWidth = H * 0.085;
  c.beginPath(); c.moveTo(x - w * 0.2, y - H * 0.45); c.lineTo(x - w * 0.22 + sw, y - H * 0.04);
  c.moveTo(x + w * 0.2, y - H * 0.45); c.lineTo(x + w * 0.22 - sw, y - H * 0.04); c.stroke();
  c.strokeStyle = col('#3A4452'); c.lineWidth = H * 0.065;

async function aiReply(steps){
  // steps: [{tool, res, run?:fn returning Promise|void}] then text

  for (const s of steps) {
    if (s.tool) { const w = document.createElement('div'); w.innerHTML = toolRow(s.tool, '', true); d.appendChild(w.firstChild); log.scrollTop = log.scrollHeight;
      let out = s.res; if (s.run) { const r = await s.run(); if (r !== undefined) out = r; } else await wait(500 + Math.random() * 400);
      const done = document.createElement('div'); done.innerHTML = toolRow(s.tool, out); d.replaceChild(done.firstChild, d.lastChild); if (s.after) { const x = document.createElement('div'); x.innerHTML = s.after; d.appendChild(x.firstChild); } icons(); }
    else if (s.text) { const txt = typeof s.text === 'function' ? s.text() : s.text; if (!txt) continue; const p = document.createElement('p'); d.appendChild(p); const words = txt.split(' ');

}

async function respond(text, opt){

/* ================= left click: focus, region select, hold to look ================= */
function frameInv(vr){ return vr.M ? vr.M.inv : (x, y) => [(x - vr.r.x) / vr.r.w, (y - vr.r.y) / vr.r.h]; }
function regionOf(vr, x0, y0, x1, y1){
  const P = frameInv(vr), a = P(Math.min(x0, x1), Math.min(y0, y1)), b = P(Math.max(x0, x1), Math.max(y0, y1));
  return { u0: a[0], v0: a[1], u1: b[0], v1: b[1] };
}
function ctrOf(vr, tg){ return frameInv(vr)(tg.box[0] + tg.box[2] / 2, tg.box[1] + tg.box[3] / 2); }
function inRegion(vr, tg, R){ R = R || ovOf(vr.view.id).region; if (!R) return false; const [u, v] = ctrOf(vr, tg); return u >= R.u0 && u <= R.u1 && v >= R.v0 && v <= R.v1; }
function regionTargets(vr){ const R = ovOf(vr.view.id).region; return R ? vr.targets.filter(t => inRegion(vr, t, R)) : []; }
function ptInRegion(vr, x, y){ const R = ovOf(vr.view.id).region; if (!R) return false; const [u, v] = frameInv(vr)(x, y); return u >= R.u0 && u <= R.u1 && v >= R.v0 && v <= R.v1; }
function asHuman(fn){ S.humanCmd = true; try { fn(); } finally { S.humanCmd = false; } }

function startPick(vr, e){
  const rect = vr.cv.getBoundingClientRect(), x0 = e.clientX - rect.left, y0 = e.clientY - rect.top, o = ovOf(vr.view.id);
  let moved = false, held = false;
  const hold = setTimeout(() => { if (!moved) { held = true; lookHere(vr, x0, y0); } }, 460);
  const move = ev => {
    const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
    if (!moved && Math.hypot(x - x0, y - y0) > 8) { moved = true; clearTimeout(hold); hideQbar(); o.region = null; o.focus = null; }
    if (moved) o.drag = regionOf(vr, x0, y0, x, y);
  };
  const up = ev => {
    clearTimeout(hold); document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
    const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
    if (moved) {
      const R = regionOf(vr, x0, y0, x, y); o.drag = null;
      if (Math.abs(R.u1 - R.u0) > 0.025 && Math.abs(R.v1 - R.v0) > 0.025) {
        o.region = R; o.detect = true; o.cls = null; o.regionOnly = true;
        const n = regionTargets(vr).length;
        showQbar(vr, null); toolNote(`select_region(view="${vr.view.id}", box=[${R.u0.toFixed(2)},${R.v0.toFixed(2)},${R.u1.toFixed(2)},${R.v1.toFixed(2)}])`, n + (n === 1 ? ' object' : ' objects'));
      }
    } else if (!held) {
      const hit = hitTest(vr, x, y);
      if (hit) { o.focus = hit.id; o.region = null; o.regionOnly = false; showQbar(vr, hit); flashTarget(vr, hit.id); }
      else { o.focus = null; o.region = null; o.regionOnly = false; hideQbar(); }
    }
  };
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
}
function lookHere(vr, x, y){
  flashTarget(vr, null, [x, y]);
  if (S.dev.kind === 'arm' && S.replay) { toast('This is a recording. Go live to move the robot.', 'history'); return; }
  if (S.dev.kind === 'arm') { const tp = tablePoint(vr, x, y); if (tp) asHuman(() => armLook(tp[0], tp[1])); }
  else { doAct('lookcam', vr, x, y, null, null); toast(vr.view.ptz ? 'Camera centring there' : 'Zooming there', 'focus'); }
}
/* the floating action bar that follows whatever you picked */
function showQbar(vr, tg){ S.qbar = { view: vr.view.id, id: tg ? tg.id : null, kind: tg ? 'target' : 'region' }; renderQbar(); }
function hideQbar(){ S.qbar = null; const el = $('#qbar'); if (el) el.hidden = true; }
function renderQbar(){
  const q = S.qbar, el = $('#qbar'); if (!q) { el.hidden = true; return; }
  const vr = VR.find(v => v.view.id === q.view); if (!vr || vr.el.hidden) { el.hidden = true; return; }
  const arm = S.dev.kind === 'arm';
  let label, acts;

    const n = regionTargets(vr).length; label = `${n} in box`;
    acts = [['segmentR', 'shapes', 'Segment all'], ['trackR', 'crosshair', 'Track all'], ['askR', 'message-square-text', 'Ask'], ['zoneR', 'siren', 'Alert zone']];
    if (arm && !S.replay) acts.unshift(['graspR', 'hand-grab', 'Grasp nearest']);
  } else {
    const tg = vr.targets.find(t => t.id === q.id); if (!tg) { el.hidden = true; return; }
    label = tg.label;
    acts = arm && S.replay ? [['segment', 'shapes', 'Segment'], ['track', 'crosshair', 'Track'], ['ask', 'message-square-text', 'Ask']]
         : arm ? [['look', 'eye', 'Look'], ['go', 'navigation', 'Go'], ['grasp', 'hand-grab', 'Grasp'], ['segment', 'shapes', 'Segment'], ['ask', 'message-square-text', 'Ask']]
                : [['segment', 'shapes', 'Segment'], ['track', 'crosshair', 'Track'], ['lookcam', 'focus', 'Look here'], ['ask', 'message-square-text', 'Ask'], ['zone', 'siren', 'Alert zone']];
  }

function positionQbar(){
  const q = S.qbar, el = $('#qbar'); if (!q || el.hidden) return;

  else { const tg = vr.targets.find(t => t.id === q.id); if (!tg) return; bx = tg.box[0]; by = tg.box[1]; }
  const vp = $('#viewport').getBoundingClientRect(), tr = vr.el.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  const ox = tr.left - vp.left, oy = tr.top - vp.top;
  let left = ox + bx, top = oy + by - h - 8;
  if (top < oy + 4) top = oy + by + 8;
  left = clamp(left, ox + 4, ox + tr.width - w - 4); top = clamp(top, oy + 4, oy + tr.height - h - 4);
  if (el._l !== left || el._t !== top) { el._l = left; el._t = top; el.style.left = Math.round(left) + 'px'; el.style.top = Math.round(top) + 'px'; }

function qbarAct(a){
  const q = S.qbar; if (!q) return;
  const vr = VR.find(v => v.view.id === q.view); if (!vr) return;

function planTask(text){
  const t = text.toLowerCase();

    { kind: 'grasp', obj: 'mug', label: 'Grasp the red mug', hard: true },
    { kind: 'place', at: 'plate', label: 'Place it on the plate' },
    { kind: 'home', label: 'Return home' } ] };
  if (/(stack|cube|sort|tidy|plate)/.test(t)) return { steps: [
    { kind: 'grasp', obj: 'cubeB', label: 'Grasp the blue cube' },
    { kind: 'place', at: 'plate', label: 'Place the blue cube on the plate' },
    { kind: 'grasp', obj: 'cubeG', label: 'Grasp the green cube' },
    { kind: 'place', x: 0.28, y: 0.46, label: 'Place the green cube beside the plate' },
    { kind: 'home', label: 'Return home' } ] };
  if (/(clear|empty|move everything|off the mat)/.test(t)) return { steps: [
    { kind: 'grasp', obj: 'cubeB', label: 'Grasp the blue cube' }, { kind: 'place', x: -0.27, y: 0.4, label: 'Move it off the mat' },
    { kind: 'grasp', obj: 'banana', label: 'Grasp the banana' }, { kind: 'place', x: -0.27, y: 0.54, label: 'Move it off the mat' },
    { kind: 'home', label: 'Return home' } ] };
  const g = S.objs.find(q => !q.fixed);
  return { note: 'I read this as a pick-and-place. Tell me in chat if you meant something else.', steps: [
    { kind: 'grasp', obj: g.id, label: 'Grasp the ' + g.label }, { kind: 'place', at: 'plate', label: 'Place it on the plate' } ] };
}

function findLib(id){ return [...S.lib.episodes, ...S.lib.hours, S.lib.file, ...S.lib.armEvents, ...S.lib.camEvents, ...S.lib.fileEvents].find(x => x && x.id === id); }
function openLibItem(id){

    if (x.live) { S.replay = null; setView('console'); goLive(); seek(x.sceneT - 3); const i = S.dev.views.findIndex(v => v.id === x.view); if (i >= 0) select(i); return; }

function openItem(it, at = 0, viewId){

  if (it.kind === 'file') { S.replay = null; setView('console'); seek(Math.max(0, at)); if (!S.playing) togglePlay(); return; }

  S.replay = { kind: it.kind, item: it, dur: it.kind === 'episode' ? it.dur : 3600, label, marks: it.marks };
  S.follow = false; S.speed = 1; $('#tpSpeed').textContent = '1×'; S.t = clamp(at, 0, S.replay.dur); S.playing = true;
  hideQbar(); VR.forEach(vr => { vr.trails = {}; });

function renderModeSeg(){

function replayStripTick(now, force){
  if (!force && now - (S._rsAt || 0) < 120) return; S._rsAt = now;
  const R = S.replay, ep = R && R.item; if (!ep || !$('#tkFill')) return;
  const p = curveAt(ep, S.t), lab = ep.track.labels.filter(l => l.t <= S.t).pop(), end = S.t >= R.dur - 0.05;
  $('#tkFill').style.width = Math.round(S.t / R.dur * 100) + '%';
  $('#tkStep').textContent = `${fmtDur(S.t)} / ${fmtDur(R.dur)} · ${lab ? lab.text : 'Start'} · ${ep.policy}`;
  $('#tkVal').textContent = (end ? (ep.outcome === 'failed' ? 'FAILED ' : ep.outcome === 'stopped' ? 'STOPPED ' : 'SUCCESS ') : p >= 0.75 ? 'ON TRACK ' : 'AT RISK ') + p.toFixed(2);
  $('#verif').className = 'verif ' + (p >= 0.75 ? 'good' : p >= 0.5 ? 'risk' : 'bad');
  const cv = $('#vSpark'), c = cv.getContext('2d'), w = cv.width, h = cv.height, C = ep.curve;
  c.clearRect(0, 0, w, h); c.strokeStyle = 'rgba(130,142,162,.4)'; c.lineWidth = 1.5; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke(); c.setLineDash([]);
  c.strokeStyle = ep.outcome === 'failed' ? '#FF4D5A' : ep.outcome === 'caught' ? '#FFB547' : '#3FD49B'; c.lineWidth = 3; c.lineJoin = 'round'; c.beginPath();
  C.forEach((q, i) => { const x = i / (C.length - 1) * (w - 4) + 2, y = h - 3 - q * (h - 6); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke();
  const px = S.t / R.dur * (w - 4) + 2; c.strokeStyle = 'rgba(140,150,168,.95)'; c.lineWidth = 2; c.beginPath(); c.moveTo(px, 0); c.lineTo(px, h); c.stroke();
}
function libFilterFromText(t){
  const k = libKind(), U = S.libUI, hit = [];
  if (/\bevents?\b/.test(t)) { U.tab = 'events'; U.f = 'all'; hit.push('tab="events"'); }
  else if (/(episode|rollout|recording|hours?\b)/.test(t)) { U.tab = 'items'; hit.push('tab="' + (k === 'arm' ? 'episodes' : 'recordings') + '"'); }
  const map = k === 'arm' ? [[/(caught|early|predict)/, 'caught'], [/fail/, 'failed'], [/(succe|worked)/, 'success'], [/stop/, 'stopped'], [/(demo|teleop)/, 'demo']]
    : [[/alert/, 'alerts'], [/clip/, 'clips'], [/busy/, 'busy'], [/night/, 'night']];
  if (U.tab === 'items') for (const [re, key] of map) if (re.test(t)) { U.f = key; hit.push('filter="' + key + '"'); break; }
  if (/(today|24 ?h|last day)/.test(t)) { U.range = '24h'; hit.push('range="24h"'); } else if (/(week|7 ?days)/.test(t)) { U.range = '7d'; hit.push('range="7d"'); }
  if (/(π0|pi ?0)/.test(t)) { U.policy = 'π0.5'; hit.push('policy="π0.5"'); } else if (/(gr00t|groot)/.test(t)) { U.policy = 'GR00T N1.5'; hit.push('policy="GR00T N1.5"'); }
  return hit.length ? hit.join(', ') : null;
}
function compareSel(){
  const xs = [...S.libUI.sel].map(findLib).filter(Boolean), eps = xs.filter(x => x.kind === 'episode');
  if (eps.length) {
    const by = o => eps.filter(e => e.outcome === o).length, bad = eps.filter(e => e.outcome === 'failed'), reasons = [...new Set(bad.map(e => e.reason))];
    const durs = eps.map(e => e.dur).sort((a, b) => a - b), med = durs[Math.floor(durs.length / 2)];
    const txt = `${eps.length} episodes: ${by('success')} succeeded, ${by('caught')} caught early, ${bad.length} failed${by('stopped') ? ', ' + by('stopped') + ' stopped' : ''}${by('demo') ? ', ' + by('demo') + ' human demos' : ''}. `
      + (bad.length ? `Failure cause${reasons.length > 1 ? 's' : ''}: ${reasons.join('; ')}. The verifier flagged ${bad.filter(e => e.predicted).length} of ${bad.length} before contact. ` : '')
      + `Median length ${fmtDur(med)}.` + (new Set(eps.map(e => e.policy)).size > 1 ? ' More than one policy is in this set; filter by policy to compare them fairly.' : '');
    return [{ tool: `library.compare(ids=[${eps.map(e => '"' + e.id + '"').join(', ')}])`, res: eps.length + ' episodes' }, { text: txt }];
  }
  const hs = xs.filter(x => x.kind === 'hour'), evs = xs.filter(x => x.kind === 'event');
  const al = hs.reduce((a, h) => a + h.alerts, 0) + evs.length, top = hs.slice().sort((a, b) => b.people - a.people)[0];
  return [{ tool: `library.compare(n=${xs.length})`, res: xs.length + ' items' }, { text: `${xs.length} items, ${al} alert${al === 1 ? '' : 's'} between them.` + (top ? ` Busiest was ${hhmm(top.start)} with ${top.people} people at peak and ${top.forklifts} forklift passes.` : '') + (evs.length ? ` Most common event: ${Object.entries(evs.reduce((m, e) => (m[e.type] = (m[e.type] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1])[0][0].toLowerCase()}.` : '') }];
}
function libBulk(a){
